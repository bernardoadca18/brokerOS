services:
  postgres:
    image: postgres:16-alpine
    container_name: brokeros-db
    environment:
      POSTGRES_USER: brokeros
      POSTGRES_PASSWORD: brokeros_dev
      POSTGRES_DB: brokeros
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brokeros -d brokeros"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
